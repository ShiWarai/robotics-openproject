# Self-contained multi-arch (amd64+arm64) OpenProject image → GHCR
# main → <org>/robotics-openproject:main
# dev → <org>/robotics-openproject:prerelease (requires [prerelease] in commit msg)
name: Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    if: |
      (github.ref == 'refs/heads/main') ||
      (github.ref == 'refs/heads/dev' && contains(github.event.head_commit.message, '[prerelease]'))
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image base
        run: echo "IMAGE_BASE=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "suffix=main" >> $GITHUB_OUTPUT
          else
            echo "suffix=prerelease" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_BASE }}:${{ steps.tag.outputs.suffix }}
            ${{ env.IMAGE_BASE }}:${{ github.sha }}
          push: true
          provenance: false
          cache-from: type=ghcr,ref=${{ env.IMAGE_BASE }}:buildcache
          cache-to: type=ghcr,ref=${{ env.IMAGE_BASE }}:buildcache,mode=max
