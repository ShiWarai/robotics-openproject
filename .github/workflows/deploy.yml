# Self-contained multi-arch (amd64+arm64) OpenProject image → GHCR
# main → <org>/robotics-openproject:main
# dev → <org>/robotics-openproject:prerelease (requires [prerelease] in commit msg)
# Each arch builds on its native official runner (no QEMU); a merge job
# combines the per-arch images into multi-arch manifest lists.
name: Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: |
      (github.ref == 'refs/heads/main') ||
      (github.ref == 'refs/heads/dev' && contains(github.event.head_commit.message, '[prerelease]'))
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image base
        run: echo "IMAGE_BASE=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "suffix=main" >> $GITHUB_OUTPUT
          else
            echo "suffix=prerelease" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          tags: |
            ${{ env.IMAGE_BASE }}:${{ github.sha }}-${{ matrix.arch }}
          push: true
          provenance: false
          cache-from: type=registry,ref=${{ env.IMAGE_BASE }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE_BASE }}:buildcache-${{ matrix.arch }},mode=max

  merge:
    needs: build
    if: |
      (github.ref == 'refs/heads/main') ||
      (github.ref == 'refs/heads/dev' && contains(github.event.head_commit.message, '[prerelease]'))
    name: Merge multi-arch manifest
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image base
        run: echo "IMAGE_BASE=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "suffix=main" >> $GITHUB_OUTPUT
          else
            echo "suffix=prerelease" >> $GITHUB_OUTPUT
          fi

      - name: Create manifest list
        run: |
          docker buildx imagetools create \
            -t "${IMAGE_BASE}:${{ steps.tag.outputs.suffix }}" \
            -t "${IMAGE_BASE}:${{ github.sha }}" \
            "${IMAGE_BASE}:${{ github.sha }}-amd64" \
            "${IMAGE_BASE}:${{ github.sha }}-arm64"
