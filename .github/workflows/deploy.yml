# Сборка и публикация образов в GHCR:
# - main → ghcr.io/<owner>/robotics-openproject:backend-main, frontend-main, ...
# - dev → ghcr.io/<owner>/robotics-openproject:backend-prerelease, frontend-prerelease, ... (только с [prerelease])
name: Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    if: |
      (github.ref == 'refs/heads/main') ||
      (github.ref == 'refs/heads/dev' && contains(github.event.head_commit.message, '[prerelease]'))
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image base
        run: echo "IMAGE_BASE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "suffix=main" >> $GITHUB_OUTPUT
          else
            echo "suffix=prerelease" >> $GITHUB_OUTPUT
          fi

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./docker/backend
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_BASE }}:backend-${{ steps.tag.outputs.suffix }}
            ${{ env.IMAGE_BASE }}:backend-${{ github.sha }}
          push: true
          provenance: false

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./docker/frontend
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_BASE }}:frontend-${{ steps.tag.outputs.suffix }}
            ${{ env.IMAGE_BASE }}:frontend-${{ github.sha }}
          push: true
          provenance: false

      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: ./docker/worker
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_BASE }}:worker-${{ steps.tag.outputs.suffix }}
            ${{ env.IMAGE_BASE }}:worker-${{ github.sha }}
          push: true
          provenance: false

      - name: Build and push builder
        uses: docker/build-push-action@v6
        with:
          context: ./docker/builder
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_BASE }}:builder-${{ steps.tag.outputs.suffix }}
            ${{ env.IMAGE_BASE }}:builder-${{ github.sha }}
          push: true
          provenance: false


